[project]
name = "lecture-worker"
version = "0.1.0"
description = "Lecture Copilot processing pipeline"
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3>=1.43.108",
    "imagehash>=4.3.2",
    "mlx-whisper>=0.4.3",
    "openai>=3.24.0",
    "pillow>=12.3.0",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.1.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
