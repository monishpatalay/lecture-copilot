name: Process lectures

# The cloud worker: claims queued lectures from the database and runs the pipeline on them,
# so uploads are processed without anyone's laptop being on.
on:
  workflow_dispatch: # the site triggers this when an upload finishes
  schedule:
    - cron: "17 */6 * * *" # backup, in case a trigger was missed

concurrency:
  group: process-lectures # one run at a time; a trigger during a run waits and then picks up what is queued
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Anything queued?
        id: queue
        run: echo "count=$(psql "$DATABASE_URL" -Atc "select count(*) from lectures where status = 'queued'")" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.queue.outputs.count != '0'
      - uses: astral-sh/setup-uv@v5
        if: steps.queue.outputs.count != '0'
      - name: Install ffmpeg
        if: steps.queue.outputs.count != '0'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      # Without mlx-whisper and sentence-transformers the worker uses Groq's Whisper and the embed Edge Function.
      - name: Process the queue
        if: steps.queue.outputs.count != '0'
        working-directory: worker
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Optional: with all three set, the professor gets an email when a lecture is ready.
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: >
          uv run --no-project --python 3.12
          --with imagehash --with pillow --with boto3 --with python-dotenv --with "psycopg[binary]" --with openai
          python -u -m lecture_worker.worker --once
